<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="70%" cy="22%" r="95%">
      <stop offset="0" stop-color="#123049"/>
      <stop offset=".55" stop-color="#0a1220"/>
      <stop offset="1" stop-color="#05070d"/>
    </radialGradient>
    <linearGradient id="v" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ce8ff"/>
      <stop offset=".55" stop-color="#46b8f5"/>
      <stop offset="1" stop-color="#6a5bff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="c"><rect width="512" height="512"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <!-- faint vector grid -->
    <g stroke="#46d9f5" stroke-opacity=".07" stroke-width="2">
      <path d="M0 128H512M0 256H512M0 384H512M128 0V512M256 0V512M384 0V512"/>
    </g>
    <circle cx="256" cy="256" r="178" fill="none" stroke="#46d9f5" stroke-opacity=".14" stroke-width="3"/>
    <!-- V made of two vectors, right one ending in an arrowhead -->
    <g filter="url(#glow)" fill="none" stroke="url(#v)" stroke-linecap="round" stroke-linejoin="round">
      <path d="M150 176L248 352" stroke-width="44"/>
      <path d="M248 352L352 166" stroke-width="44"/>
      <path d="M300 160H360V220" stroke-width="36"/>
    </g>
    <!-- vector nodes -->
    <g fill="#e9fbff">
      <circle cx="150" cy="176" r="13"/>
      <circle cx="248" cy="352" r="13"/>
    </g>
  </g>
</svg>
