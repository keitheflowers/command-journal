name: Android app
# Builds the Android app (APK) from the web app. Download it from the run's
# "Artifacts" section, copy it to the phone and open it to install.
on:
  push:
    branches: [main]
    paths: ['android-app/**', '*.js', '*.html', 'icons/**', 'vendor/**', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: android-app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Install Capacitor and plugins
        working-directory: android-app
        run: npm ci
      - name: Add the "Hey Vector" speech model (Vosk small English, Apache-2.0)
        run: |
          M=android-app/android/app/src/main/assets/model-en-us
          curl -sSL --retry 3 -o /tmp/model.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q /tmp/model.zip -d /tmp/model
          mkdir -p "$M" && cp -r /tmp/model/vosk-model-small-en-us-0.15/. "$M"/
          echo "small-en-us-0.15" > "$M/uuid"
      - name: Use the app's permanent signing key (if set up)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KS" ]; then
            # pasted text may carry line breaks or spaces: drop them before decoding
            if ! printf '%s' "$KS" | tr -d ' \t\r\n' | base64 -d > "$RUNNER_TEMP/app.keystore" 2>/dev/null; then
              echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64. Paste the whole contents of keystore.b64 again (one long line, nothing else)."; exit 1
            fi
            if ! keytool -list -keystore "$RUNNER_TEMP/app.keystore" -storepass "$PW" -alias "$ALIAS" >/dev/null 2>&1; then
              echo "::error::The keystore decoded, but ANDROID_KEYSTORE_PASSWORD or ANDROID_KEY_ALIAS does not open it. Check those two secrets against SECRETS-README.txt."; exit 1
            fi
            echo "Signing key fingerprint:"; keytool -list -v -keystore "$RUNNER_TEMP/app.keystore" -storepass "$PW" -alias "$ALIAS" | grep 'SHA256:'
            echo "APP_KEYSTORE_FILE=$RUNNER_TEMP/app.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: this APK has a one-off key and cannot update an installed copy. See android-app/README.md (Updates)."
          fi
      - name: Build APK
        working-directory: android-app
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          APP_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          APP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          npm run sync
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: family-save-android
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
